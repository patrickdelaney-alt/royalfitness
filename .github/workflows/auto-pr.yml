name: Auto PR for agent branches

on:
  push:
    branches:
      - 'claude/**'
      - 'codex/**'

jobs:
  open-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Open draft PR if none exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="${GITHUB_REF#refs/heads/}"
          EXISTING=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state open --json number --jq 'length')
          if [ "$EXISTING" -eq 0 ]; then
            gh pr create --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --base main --draft --fill
          else
            echo "PR already exists for $BRANCH, skipping"
          fi
